name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

jobs:
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libgl1-mesa-dev libasound2-dev libpulse-dev

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      # tsdl-mixer 0.6 on opam has no Windows DLL support (hardcodes the Linux
      # .so name). Pin to the fixed branch until it is released to opam.
      - name: Pin tsdl-mixer to Windows-compatible branch
        run: |
          opam pin add tsdl-mixer "git+https://github.com/bluddy/tsdl-mixer.git#fix-windows-dll-search" -y

      - name: Install OPAM dependencies
        run: |
          opam install . --deps-only --with-test

      - name: Build
        run: |
          opam exec -- dune build

      - name: Run tests
        run: |
          opam exec -- dune runtest
