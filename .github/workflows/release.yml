name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage & Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libgl1-mesa-dev libasound2-dev libpulse-dev libfuse2t64

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install OPAM dependencies
        run: |
          opam install . --deps-only --with-test

      - name: Run tests
        run: |
          opam exec -- dune runtest

      - name: Build release binary
        run: |
          opam exec -- dune build -p rails --profile release

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${{ github.ref_name }}"
          fi
          VER="${VER#v}"
          echo "val=$VER" >> "$GITHUB_OUTPUT"

      - name: Package AppImage and Tarball
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.val }}"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          APPIMAGETOOL="$(pwd)/appimagetool-x86_64.AppImage" ./packaging/linux/build_appimage.sh _build/default/src/rails_run.exe "rails-${VERSION}-linux-x86_64.AppImage"
          ./packaging/linux/build_tarball.sh _build/default/src/rails_run.exe "$VERSION" "rails-${VERSION}-linux-x86_64.tar.gz"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            rails-*-linux-x86_64.AppImage
            rails-*-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (Zip with SDL DLLs)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install system dependencies (depexts)
        shell: bash
        run: |
          opam install . --depext-only -y

      - name: Configure MinGW SDL2 and pkg-config
        shell: bash
        run: |
          CYG_ROOT="C:/.opam/.cygwin/root"
          MINGW_SYSROOT="$CYG_ROOT/usr/x86_64-w64-mingw32/sys-root/mingw"
          mkdir -p "$MINGW_SYSROOT"

          TMP_DIR="./tmp_sdl_dev"
          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"

          echo "==> Downloading official SDL2 2.30.10 MinGW dev libraries..."
          curl -sL "https://github.com/libsdl-org/SDL/releases/download/release-2.30.10/SDL2-devel-2.30.10-mingw.tar.gz" -o "$TMP_DIR/sdl2-mingw.tar.gz"
          tar --force-local -xzf "$TMP_DIR/sdl2-mingw.tar.gz" -C "$TMP_DIR"
          cp -rf "$TMP_DIR"/SDL2-2.30.10/x86_64-w64-mingw32/* "$MINGW_SYSROOT/"

          echo "==> Downloading official SDL2_mixer 2.8.0 MinGW dev libraries..."
          curl -sL "https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.0/SDL2_mixer-devel-2.8.0-mingw.tar.gz" -o "$TMP_DIR/mixer-mingw.tar.gz"
          tar --force-local -xzf "$TMP_DIR/mixer-mingw.tar.gz" -C "$TMP_DIR"
          cp -rf "$TMP_DIR"/SDL2_mixer-2.8.0/x86_64-w64-mingw32/* "$MINGW_SYSROOT/"

          # Fix prefix, libdir, includedir and normalize Libs for OCaml linking.
          # We only link -lSDL2 and -lSDL2_mixer; removing -lmingw32, -lSDL2main, -mwindows, -Dmain=SDL_main
          # prevents hijacking the entry point (which causes undefined reference to wWinMain) and flexlink errors.
          sed -i 's|^prefix=.*|prefix=/usr/x86_64-w64-mingw32/sys-root/mingw|' "$MINGW_SYSROOT/lib/pkgconfig/sdl2.pc"
          sed -i 's|^libdir=.*|libdir=${prefix}/lib|' "$MINGW_SYSROOT/lib/pkgconfig/sdl2.pc"
          sed -i 's|^includedir=.*|includedir=${prefix}/include|' "$MINGW_SYSROOT/lib/pkgconfig/sdl2.pc"
          sed -i 's|^Libs:.*|Libs: -L${libdir} -lSDL2|' "$MINGW_SYSROOT/lib/pkgconfig/sdl2.pc"
          sed -i 's/-Dmain=SDL_main//g' "$MINGW_SYSROOT/lib/pkgconfig/sdl2.pc"

          sed -i 's|^prefix=.*|prefix=/usr/x86_64-w64-mingw32/sys-root/mingw|' "$MINGW_SYSROOT/lib/pkgconfig/SDL2_mixer.pc"
          sed -i 's|^libdir=.*|libdir=${prefix}/lib|' "$MINGW_SYSROOT/lib/pkgconfig/SDL2_mixer.pc"
          sed -i 's|^includedir=.*|includedir=${prefix}/include|' "$MINGW_SYSROOT/lib/pkgconfig/SDL2_mixer.pc"
          sed -i 's|^Libs:.*|Libs: -L${libdir} -lSDL2_mixer|' "$MINGW_SYSROOT/lib/pkgconfig/SDL2_mixer.pc"

          # Copy .pc files to Cygwin default pkgconfig search paths
          mkdir -p "$CYG_ROOT/usr/lib/pkgconfig" "$CYG_ROOT/lib/pkgconfig"
          cp -v "$MINGW_SYSROOT"/lib/pkgconfig/*.pc "$CYG_ROOT/usr/lib/pkgconfig/" || true
          cp -v "$MINGW_SYSROOT"/lib/pkgconfig/*.pc "$CYG_ROOT/lib/pkgconfig/" || true
          echo "MinGW .pc files configured in Cygwin:"
          ls -la "$CYG_ROOT/usr/lib/pkgconfig/"

          # Add profile.d script for Cygwin bash shells
          mkdir -p "$CYG_ROOT/etc/profile.d"
          cat << 'EOF' > "$CYG_ROOT/etc/profile.d/mingw-pkgconfig.sh"
          export PKG_CONFIG_PATH="/usr/x86_64-w64-mingw32/sys-root/mingw/lib/pkgconfig:/usr/x86_64-w64-mingw32/sys-root/mingw/share/pkgconfig:$PKG_CONFIG_PATH"
          EOF
          rm -rf "$TMP_DIR"

      - name: Install OPAM dependencies
        shell: bash
        env:
          MSYS2_ENV_CONV_EXCL: "PKG_CONFIG_PATH"
          PKG_CONFIG_PATH: "/usr/x86_64-w64-mingw32/sys-root/mingw/lib/pkgconfig:/usr/x86_64-w64-mingw32/sys-root/mingw/share/pkgconfig"
        run: |
          opam install . --deps-only

      - name: Build release binary
        shell: bash
        env:
          MSYS2_ENV_CONV_EXCL: "PKG_CONFIG_PATH"
          PKG_CONFIG_PATH: "/usr/x86_64-w64-mingw32/sys-root/mingw/lib/pkgconfig:/usr/x86_64-w64-mingw32/sys-root/mingw/share/pkgconfig"
        run: |
          opam exec -- dune build -p rails --profile release

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${{ github.ref_name }}"
          fi
          VER="${VER#v}"
          echo "val=$VER" >> "$GITHUB_OUTPUT"

      - name: Package Windows Release with SDL DLLs
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.val }}"
          ./packaging/windows/package_windows.sh _build/default/src/rails_run.exe "$VERSION" "rails-${VERSION}-windows-x86_64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: rails-*-windows-x86_64.zip

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          brew install sdl2 sdl2_mixer

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2.x

      - name: Install OPAM dependencies
        run: |
          opam install . --deps-only

      - name: Build release binary
        run: |
          opam exec -- dune build -p rails --profile release

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
          else
            VER="${{ github.ref_name }}"
          fi
          VER="${VER#v}"
          echo "val=$VER" >> "$GITHUB_OUTPUT"

      - name: Package macOS Release Bundle
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.val }}"
          ./packaging/macos/package_macos.sh _build/default/src/rails_run.exe "$VERSION" "${{ matrix.arch }}" "rails-${VERSION}-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-package
          path: rails-*-macos-${{ matrix.arch }}.zip

  publish-release:
    name: Publish GitHub Release
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && !contains(needs.*.result, 'cancelled') && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
